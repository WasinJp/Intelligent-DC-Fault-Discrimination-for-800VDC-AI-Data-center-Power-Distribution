<text x="846" y="524" text-anchor="start" font-size="11" fill="#C22F2A" >→ Q_f48 gate (rack-side fault, Sheet 1)</text>
<text x="60" y="690" text-anchor="start" font-size="12" fill="#C22F2A" >The MCU can only START a fault pulse (rising edge on FAULT_x). The pulse length is set by R_t·C_t in the one-shot;</text>
<text x="60" y="710" text-anchor="start" font-size="12" fill="#C22F2A" >no firmware state can hold the fault switch closed. The ARM key switch is in series with both one-shot outputs.</text>
<rect x="1100" y="130" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="165.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">Feeder node TRIP (PF13)</text>
<path d="M1300,160 L1360,160" fill="none" stroke="#12263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1360" y="135" width="90" height="50" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1405.0" y="165.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">U18 driver</text>
<path d="M1450,160 L1500,160" fill="none" stroke="#12263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1506" y="164" text-anchor="start" font-size="11" fill="#C22F2A" >→ Q_fb gate (feeder breaker)  — inverted: TRIP high = gate low</text>
<rect x="1100" y="220" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="255.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">Rack node TRIP (PF13)</text>
<path d="M1300,250 L1360,250" fill="none" stroke="#12263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1360" y="225" width="90" height="50" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1405.0" y="255.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">U19 driver</text>
<path d="M1450,250 L1500,250" fill="none" stroke="#12263A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1506" y="254" text-anchor="start" font-size="11" fill="#C22F2A" >→ Q_brk gate (rack breaker)  — inverted: TRIP high = gate low</text>
<text x="1100" y="300" text-anchor="start" font-size="11" fill="#7A8794" >Both breaker drivers have a 10 kΩ pull-down on their input so an unpowered node = breaker OPEN (fail-safe);</text>
<text x="1100" y="318" text-anchor="start" font-size="11" fill="#7A8794" >an inverting driver (or TRIP active-low in firmware) gives breaker CLOSED at TRIP = 0.</text>
<rect x="1100" y="380" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="415.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">UVLO emulation</text>
<text x="1310" y="396" text-anchor="start" font-size="11" fill="#12263A" >ADC3 on v_out (1 MSa/s): < 9.6 V for 100 µs → all LOAD gates low;</text>
<text x="1310" y="414" text-anchor="start" font-size="11" fill="#12263A" >re-enable above 10.1 V (the model's POL UVLO, V_uvlo48 / t_uvlo48 / V_hyst48 scaled)</text>
<rect x="1100" y="460" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="495.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">SYNC out (BNC)</text>
<text x="1310" y="476" text-anchor="start" font-size="11" fill="#12263A" >one pulse at each scheduled event → feeder node PF12, rack node PF12, scope ch1</text>
<rect x="1100" y="540" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="575.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">DAC1 / DAC2 (PA4 / PA5)</text>
<text x="1310" y="556" text-anchor="start" font-size="11" fill="#12263A" >12-bit, 1 MSa/s replay tables from tools/replay_waveforms.py → the node's SMA i / SMA v</text>
<text x="1310" y="574" text-anchor="start" font-size="11" fill="#12263A" >(latency test, Sheet 2 JP1/JP2); 0–3.3 V, through 100 Ω</text>
<rect x="1100" y="620" width="200" height="60" rx="4" fill="#fff" stroke="#12263A" stroke-width="2"/>
<text x="1200.0" y="655.0" text-anchor="middle" font-size="11" fill="#12263A" font-weight="700">USB-serial CLI</text>
<text x="1310" y="636" text-anchor="start" font-size="11" fill="#12263A" >tools/bench_run.py scripts the SCALING_SHEET §6 plan: 200 benign events, 80 faults, every run recorded</text>
<text x="60" y="745" text-anchor="start" font-size="12" fill="#7A8794" >Driver supply: 12 V from the bench bus through a 1 A fuse (gate drive for the logic-level MOSFETs); logic 3.3 V from the Nucleo. Common ground with the bench star.</text>
<text x="60" y="767" text-anchor="start" font-size="12" fill="#7A8794" >Scope: ch1 SYNC, ch2 rack shunt (differential probe ≥ 10 MHz, across R_sh2), ch3 ONSET (PF14), ch4 TRIP (PF13) → onset-to-trip latency and the raw fault front.</text></svg>